<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Reminder Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Sales Reminder Desk</p>
        <h1>銷售紀錄查詢與回購週期提醒</h1>
        <p class="intro">Excel 匯入後直接使用原始銷售明細，不做客戶主檔轉換。</p>
      </div>
      <div class="top-actions">
        <label class="file-button">
          匯入 Excel / CSV
          <input id="excelInput" type="file" accept=".xlsx,.xls,.csv">
        </label>
      </div>
    </header>

    <section class="import-card">
      <div>
        <p class="section-label">Import</p>
        <h2>原始欄位直接查詢</h2>
        <p class="muted">
          目前固定讀取並保留欄位：日期、客戶全稱、品名規格、數量、原幣單價、總額、人員姓名、區域名稱。
        </p>
      </div>
      <div class="import-status" id="importStatus">目前使用示範資料。</div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="section-label">Reminder</p>
          <h2>客戶週期提醒</h2>
        </div>
      </div>

      <div class="filters reminder-filters">
        <label>
          提醒月份
          <input id="reminderMonth" type="month">
        </label>
        <label>
          人員姓名
          <input id="reminderOwnerFilter" type="text" placeholder="輸入業務姓名">
        </label>
      </div>

      <div id="reminderList" class="stack-list"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="section-label">Search</p>
          <h2>銷售紀錄查詢</h2>
        </div>
      </div>

      <div class="filters">
        <label>
          開始日期
          <input id="startDateFilter" type="date">
        </label>
        <label>
          結束日期
          <input id="endDateFilter" type="date">
        </label>
        <label>
          客戶全稱
          <input id="customerFilter" type="text" placeholder="輸入客戶全稱">
        </label>
        <label>
          品名規格
          <input id="productFilter" type="text" placeholder="輸入品名規格">
        </label>
        <label>
          人員姓名
          <input id="ownerFilter" type="text" placeholder="輸入人員姓名">
        </label>
        <label>
          區域名稱
          <input id="areaFilter" type="text" placeholder="輸入區域名稱">
        </label>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>客戶全稱</th>
              <th>品名規格</th>
              <th>數量</th>
              <th>原幣單價</th>
              <th>總額</th>
              <th>人員姓名</th>
              <th>區域名稱</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
