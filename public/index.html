<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇東生醫(股)公司</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark">
          <img src="assets/logo.png" alt="宇東生醫標誌" class="brand-logo">
        </div>
        <div class="brand-copy">
          <p class="eyebrow">Yu-Dong Biomedical Co., Ltd.</p>
          <h1>宇東生醫(股)公司</h1>
        </div>
      </div>
      <div class="top-actions">
        <span id="userBadge" class="user-badge" hidden></span>
        <button id="loginToggleBtn" class="ghost" type="button">登入</button>
        <button id="importToggleBtn" class="ghost" type="button" hidden>匯入資料</button>
        <button id="logoutBtn" class="ghost" type="button" hidden>登出</button>
      </div>
    </header>

    <section class="import-card import-card--compact">
      <p class="section-label">Dataset</p>
      <h2>目前資料狀態</h2>
      <div class="import-status" id="importStatus">請先登入系統。</div>
    </section>

    <nav class="sheet-tabs" aria-label="功能分頁">
      <button type="button" class="sheet-tab is-active" data-tab-target="reminderPanel">客戶週期提醒</button>
      <button type="button" class="sheet-tab" data-tab-target="recordsPanel">銷售紀錄查詢</button>
    </nav>

    <section class="panel tab-panel is-active" id="reminderPanel" data-tab-panel>
      <div class="panel-head">
        <div>
          <p class="section-label">Reminder</p>
          <h2>客戶週期提醒</h2>
        </div>
      </div>

      <div class="filters reminder-filters">
        <label>
          提醒月份
          <input id="reminderMonth" type="month">
        </label>
        <label>
          人員姓名
          <input id="reminderOwnerFilter" type="text" placeholder="輸入業務姓名">
        </label>
      </div>

      <div id="reminderList" class="stack-list"></div>
    </section>

    <section class="panel tab-panel" id="recordsPanel" data-tab-panel hidden>
      <div class="panel-head">
        <div>
          <p class="section-label">Search</p>
          <h2>銷售紀錄查詢</h2>
          <p class="muted mobile-hint">手機可直接橫向拖移查看完整欄位。</p>
        </div>
      </div>

      <div class="filters primary-filters">
        <label>
          客戶全稱
          <input id="customerFilter" type="text" placeholder="輸入客戶全稱">
        </label>
        <label>
          品名規格
          <input id="productFilter" type="text" placeholder="輸入品名規格">
        </label>
        <label>
          人員姓名
          <input id="ownerFilter" type="text" placeholder="輸入人員姓名">
        </label>
      </div>

      <details class="advanced-filters">
        <summary>進階篩選</summary>
        <div class="filters secondary-filters">
          <label>
            開始日期
            <input id="startDateFilter" type="date">
          </label>
          <label>
            結束日期
            <input id="endDateFilter" type="date">
          </label>
          <label>
            區域名稱
            <input id="areaFilter" type="text" placeholder="輸入區域名稱">
          </label>
        </div>
      </details>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>客戶全稱</th>
              <th>品名規格</th>
              <th>數量</th>
              <th>原幣單價</th>
              <th>總額</th>
              <th>人員姓名</th>
              <th>區域名稱</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="modalBackdrop" class="modal-backdrop" hidden></div>

  <section class="modal-card" id="authCard" hidden aria-modal="true" role="dialog" aria-labelledby="authTitle">
    <button id="authCloseBtn" class="modal-close" type="button" aria-label="關閉登入視窗">×</button>
    <div>
      <p class="section-label">Sign In</p>
      <h2 id="authTitle">登入系統</h2>
      <p class="muted">請使用你在 Firebase Authentication 建立的公司帳號登入。</p>
    </div>
    <form id="loginForm" class="login-form">
      <label>
        Email
        <input id="emailInput" type="email" autocomplete="username" required>
      </label>
      <label>
        密碼
        <input id="passwordInput" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">登入</button>
      <p id="loginMessage" class="muted"></p>
    </form>
  </section>

  <section class="modal-card" id="adminImportCard" hidden aria-modal="true" role="dialog" aria-labelledby="importTitle">
    <button id="importCloseBtn" class="modal-close" type="button" aria-label="關閉匯入視窗">×</button>
    <div>
      <p class="section-label">Import</p>
      <h2 id="importTitle">管理者資料匯入</h2>
      <p class="muted">只有管理者可以匯入 Excel 或 CSV。每次匯入都會覆蓋目前系統顯示的資料版本。</p>
    </div>
    <div class="top-actions">
      <label class="file-button">
        匯入 Excel / CSV
        <input id="excelInput" type="file" accept=".xlsx,.xls,.csv">
      </label>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
